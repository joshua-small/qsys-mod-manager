name: Catalog
on:
  workflow_dispatch:
  pull_request:
    paths: ['global.json', 'CatalogTool/**', 'CatalogTests/**', 'Core/**', 'Tests/**', 'catalog/**', '.github/workflows/catalog.yml', '.github/workflows/publish-mod-catalog.yml']
  push:
    branches: [main]
    paths: ['global.json', 'CatalogTool/**', 'CatalogTests/**', 'Core/**', 'Tests/**', 'catalog/**', '.github/workflows/catalog.yml', '.github/workflows/publish-mod-catalog.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline lifecycle and publishing contracts
        run: python Tests/run_offline.py artifacts/offline-tests
